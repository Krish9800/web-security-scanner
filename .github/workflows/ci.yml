name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-security-gates:
    name: Lint, Type Check, SAST, and Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Code Quality & Style Gate
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy Strict Static Type Verification
        run: |
          mypy src tests

      - name: Bandit SAST Security Vulnerability Audit
        run: |
          bandit -c pyproject.toml -r src

      - name: Pytest Execution with 90% Coverage Gate
        run: |
          pytest -v --cov=webscan --cov-report=term-missing --cov-fail-under=90
